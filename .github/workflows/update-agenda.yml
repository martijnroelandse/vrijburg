name: Agenda bijwerken van vrijburg.nl

# vrijburg.nl publiceert de agenda als JSON (/evenementen/index.json), maar
# zonder CORS-header, dus de browser mag die niet vanaf liturgie.vrijburg.nl
# lezen. Deze workflow kopieert de JSON dagelijks naar agenda.json; de app
# probeert eerst live en valt anders hierop terug. Overbodig zodra
# vrijburg.nl Access-Control-Allow-Origin meestuurt (zie scripts/update-agenda.py).
#
# Bijkomend voordeel: de regelmatige commits houden geplande workflows
# (zoals keep-supabase-active) actief; GitHub zet die anders uit na
# 60 dagen zonder commits.

on:
  schedule:
    - cron: '17 4 * * *' # dagelijks ~06:17 Amsterdamse tijd
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update-agenda.py
      - .github/workflows/update-agenda.yml

permissions:
  contents: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Agenda ophalen
        run: python3 scripts/update-agenda.py

      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- agenda.json && git ls-files --error-unmatch agenda.json >/dev/null 2>&1; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda bijgewerkt van vrijburg.nl"
          git push
